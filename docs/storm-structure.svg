<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-labelledby="t d">
<title id="t">The storm in cross-section</title>
<desc id="d">A vertical slice through the mature storm along the shear direction, drawn to scale: the mixed layer, cloud base, freezing and glaciation levels, the equilibrium level and the anvil, the tilted tower and its mesocyclone, the rain shaft and downdraft, and the wall cloud, funnel and debris cloud at the base.</desc>

<defs>
  <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="545">
    <stop offset="0" stop-color="#0a1017"/>
    <stop offset="1" stop-color="#141d29"/>
  </linearGradient>
  <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="185" x2="0" y2="530">
    <stop offset="0" stop-color="#f2f5f9"/>
    <stop offset="0.45" stop-color="#ccd3de"/>
    <stop offset="1" stop-color="#7d8a9b"/>
  </linearGradient>
  <clipPath id="flatbase">
    <rect x="172" y="60" width="800" height="450"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="1000" height="625" fill="#0d141d"/>

<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

  <text x="16" y="28" fill="#e9eef5" font-size="16" font-weight="600">The storm in cross-section, sliced along the shear</text>
  <text x="16" y="45" fill="#8f9cad" font-size="11">Downstream is to the right. The mature storm, at the moment the tornado is on the ground.</text>

  <!-- domain -->
  <rect x="172" y="60" width="800" height="485" fill="url(#sky)"/>
  <rect x="172" y="60" width="800" height="175" fill="#ffffff" opacity="0.035"/>
  <rect x="172" y="515" width="800" height="30" fill="#ffffff" opacity="0.05"/>
  <rect x="909" y="60" width="63" height="485" fill="#ffffff" opacity="0.035"/>
  <line x1="909" y1="60" x2="909" y2="545" stroke="#4a5b6e" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- levels, under the cloud -->
  <g stroke="#6b7a8d" stroke-width="1" stroke-dasharray="5 5" opacity="0.8">
    <line x1="172" y1="235" x2="972" y2="235"/>
    <line x1="172" y1="276" x2="972" y2="276"/>
    <line x1="172" y1="410" x2="972" y2="410"/>
    <line x1="172" y1="510" x2="972" y2="510"/>
  </g>
  <line x1="180" y1="457" x2="300" y2="457" stroke="#b48ead" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>

  <!-- rain shaft -->
  <path d="M 448 510 L 580 510 L 648 545 L 474 545 Z" fill="#7aa8d4" opacity="0.24"/>
  <g stroke="#9cc2e4" stroke-width="1" opacity="0.38">
    <line x1="472" y1="514" x2="488" y2="542"/>
    <line x1="500" y1="514" x2="516" y2="542"/>
    <line x1="528" y1="514" x2="544" y2="542"/>
    <line x1="556" y1="514" x2="572" y2="542"/>
    <line x1="576" y1="518" x2="592" y2="542"/>
  </g>

  <!-- the cloud: overlapping circles, clipped to a flat base at the LCL -->
  <g fill="url(#cloud)" clip-path="url(#flatbase)">
    <!-- tower, along the leaning axis -->
    <circle cx="372" cy="495" r="44"/>
    <circle cx="380" cy="474" r="45.8"/>
    <circle cx="389" cy="453" r="47.7"/>
    <circle cx="397" cy="433" r="49.5"/>
    <circle cx="405" cy="412" r="51.3"/>
    <circle cx="413" cy="391" r="53.2"/>
    <circle cx="422" cy="370" r="55"/>
    <circle cx="430" cy="349" r="56.8"/>
    <circle cx="438" cy="328" r="58.7"/>
    <circle cx="446" cy="308" r="60.5"/>
    <circle cx="454" cy="287" r="62.3"/>
    <circle cx="463" cy="266" r="64.2"/>
    <circle cx="471" cy="245" r="66"/>
    <!-- cauliflower turrets on the flanks -->
    <circle cx="352" cy="444" r="20"/>
    <circle cx="368" cy="393" r="21"/>
    <circle cx="384" cy="342" r="22"/>
    <circle cx="401" cy="290" r="23"/>
    <circle cx="434" cy="448" r="20"/>
    <circle cx="457" cy="399" r="21"/>
    <circle cx="479" cy="350" r="22"/>
    <!-- overshooting top -->
    <circle cx="485" cy="205" r="30"/>
    <circle cx="507" cy="214" r="25"/>
    <circle cx="463" cy="215" r="24"/>
    <!-- the anvil -->
    <path d="M 398 232
             Q 440 223 520 220
             Q 640 222 780 230
             Q 900 237 954 245
             Q 962 252 950 259
             Q 900 262 780 268
             Q 640 273 540 278
             Q 470 283 420 273
             Q 402 264 398 252 Z"/>
    <!-- mammatus hanging from the anvil underside -->
    <circle cx="600" cy="274" r="11"/>
    <circle cx="624" cy="274" r="11"/>
    <circle cx="648" cy="273" r="11"/>
    <circle cx="672" cy="272" r="11"/>
    <circle cx="696" cy="271" r="11"/>
    <circle cx="720" cy="270" r="11"/>
    <circle cx="744" cy="270" r="11"/>
    <circle cx="768" cy="269" r="11"/>
    <circle cx="792" cy="268" r="11"/>
  </g>

  <!-- heated source, drawn under the tornado it shares a column with -->
  <ellipse cx="374" cy="534" rx="48" ry="6" fill="#ff9e64" opacity="0.32"/>
  <g stroke="#ff9e64" stroke-width="1.5" opacity="0.7">
    <line x1="340" y1="530" x2="340" y2="521"/>
    <line x1="408" y1="530" x2="408" y2="521"/>
  </g>

  <!-- wall cloud, funnel, debris: below the base, so not clipped -->
  <g fill="#aeb8c6">
    <circle cx="371" cy="513" r="13"/>
    <circle cx="387" cy="515" r="14.5"/>
    <circle cx="403" cy="512" r="12"/>
  </g>
  <path d="M 380 520 L 394 520 L 390 543 L 385 543 Z" fill="#dfe4ec"/>
  <ellipse cx="387" cy="543" rx="11" ry="4" fill="#8a7f6f" opacity="0.9"/>

  <!-- mesocyclone -->
  <path d="M 314 515 L 456 515 L 540 276 L 398 276 Z" fill="none" stroke="#7ee0c0" stroke-width="1.1" stroke-dasharray="5 6" opacity="0.38"/>
  <g fill="none" stroke="#7ee0c0" stroke-width="1.5" opacity="0.65">
    <ellipse cx="400" cy="470" rx="30" ry="9"/>
    <ellipse cx="438" cy="380" rx="30" ry="9"/>
    <ellipse cx="476" cy="300" rx="30" ry="9"/>
  </g>

  <!-- updraft -->
  <path d="M 372 498 Q 398 420 438 332 Q 452 292 464 258" fill="none" stroke="#ff9e64" stroke-width="3"/>
  <path d="M 467.7 247.8 L 468.5 259.9 L 459.1 256.4 Z" fill="#ff9e64"/>

  <!-- downdraft -->
  <path d="M 510 512 Q 524 524 536 534" fill="none" stroke="#6fa3d2" stroke-width="2.5"/>
  <path d="M 543 540 L 533 538.5 L 538.5 529.5 Z" fill="#6fa3d2"/>

  <!-- cold pool -->
  <g stroke="#6fa3d2" stroke-width="2" opacity="0.9">
    <line x1="518" y1="539" x2="458" y2="539"/>
    <line x1="560" y1="539" x2="650" y2="539"/>
  </g>
  <path d="M 451 539 L 459 535.5 L 459 542.5 Z" fill="#6fa3d2"/>
  <path d="M 657 539 L 649 535.5 L 649 542.5 Z" fill="#6fa3d2"/>

  <!-- environmental wind profile -->
  <g stroke="#9fb0c4" stroke-width="1.8" opacity="0.85">
    <line x1="800" y1="478" x2="833" y2="478"/>
    <line x1="800" y1="444" x2="850" y2="444"/>
    <line x1="800" y1="410" x2="867" y2="410"/>
    <line x1="800" y1="377" x2="883" y2="377"/>
    <line x1="800" y1="343" x2="900" y2="343"/>
  </g>
  <g fill="#9fb0c4" opacity="0.85">
    <path d="M 840 478 L 833 474.7 L 833 481.3 Z"/>
    <path d="M 857 444 L 850 440.7 L 850 447.3 Z"/>
    <path d="M 874 410 L 867 406.7 L 867 413.3 Z"/>
    <path d="M 890 377 L 883 373.7 L 883 380.3 Z"/>
    <path d="M 907 343 L 900 339.7 L 900 346.3 Z"/>
  </g>
  <text x="968" y="306" text-anchor="end" fill="#9fb0c4" font-size="11">environmental wind, storm-relative</text>
  <text x="968" y="320" text-anchor="end" fill="#7d8b9c" font-size="10">4 m/s per km through 6 km, constant above</text>

  <!-- ground -->
  <rect x="172" y="545" width="800" height="11" fill="#202b37"/>
  <line x1="172" y1="545" x2="972" y2="545" stroke="#3c4d60" stroke-width="1.5"/>
  <rect x="172" y="60" width="800" height="485" fill="none" stroke="#2c3947" stroke-width="1"/>

  <!-- left level labels -->
  <g text-anchor="end">
    <text x="162" y="66" fill="#e2e8f0" font-size="11.5" font-weight="600">14.4 km</text>
    <text x="162" y="79" fill="#aeb9c7" font-size="10.5">top of domain — rigid lid</text>

    <text x="162" y="232" fill="#e2e8f0" font-size="11.5" font-weight="600">9.2 km</text>
    <text x="162" y="245" fill="#aeb9c7" font-size="10.5">equilibrium level</text>

    <text x="162" y="273" fill="#e2e8f0" font-size="11.5" font-weight="600">8.0 km</text>
    <text x="162" y="286" fill="#aeb9c7" font-size="10.5">glaciation level</text>

    <text x="162" y="407" fill="#e2e8f0" font-size="11.5" font-weight="600">4.0 km</text>
    <text x="162" y="420" fill="#aeb9c7" font-size="10.5">freezing level</text>

    <text x="162" y="507" fill="#e2e8f0" font-size="11.5" font-weight="600">1035 m</text>
    <text x="162" y="520" fill="#aeb9c7" font-size="10.5">cloud base (LCL)</text>

    <text x="162" y="551" fill="#aeb9c7" font-size="10.5">ground</text>
  </g>

  <!-- in-sky layer labels -->
  <text x="185" y="100" fill="#8b98a9" font-size="11" font-weight="600" letter-spacing="1.2">STRATOSPHERE</text>
  <text x="185" y="114" fill="#6f7d8e" font-size="10">strongly stable — the ceiling</text>

  <text x="185" y="310" fill="#8b98a9" font-size="11" font-weight="600" letter-spacing="1.2">FREE TROPOSPHERE</text>
  <text x="185" y="324" fill="#6f7d8e" font-size="10">conditionally unstable, 3.4 K/km</text>

  <text x="185" y="451" fill="#c9a4c4" font-size="10.5">the cap, act one</text>

  <text x="185" y="528" fill="#8b98a9" font-size="10.5" font-weight="600" letter-spacing="1">MIXED LAYER</text>
  <text x="185" y="541" fill="#c98a5c" font-size="10">heated, moistened source →</text>

  <!-- feature labels -->
  <line x1="478" y1="180" x2="436" y2="160" stroke="#7d8b9c" stroke-width="1"/>
  <text x="432" y="157" text-anchor="end" fill="#c6cfdb" font-size="11">overshooting top</text>

  <text x="624" y="206" fill="#c6cfdb" font-size="11">ANVIL — the outflow spreading under the stratosphere</text>

  <line x1="700" y1="284" x2="700" y2="294" stroke="#7d8b9c" stroke-width="1"/>
  <text x="690" y="304" text-anchor="end" fill="#a8b3c2" font-size="10.5">mammatus</text>

  <line x1="538" y1="304" x2="556" y2="330" stroke="#7ee0c0" stroke-width="1" opacity="0.7"/>
  <text x="560" y="336" fill="#7ee0c0" font-size="11">mesocyclone — 3.6 km core</text>
  <text x="560" y="349" fill="#5fae97" font-size="10">cyclonic; imposed, not grown</text>

  <line x1="344" y1="416" x2="388" y2="410" stroke="#e08a4e" stroke-width="1"/>
  <text x="340" y="419" text-anchor="end" fill="#ffb184" font-size="11">updraft, 50 m/s</text>

  <line x1="600" y1="502" x2="568" y2="512" stroke="#7d8b9c" stroke-width="1"/>
  <text x="604" y="505" fill="#a9c6e2" font-size="11">rain-cooled downdraft</text>
  <text x="604" y="522" fill="#8fa8c0" font-size="10.5">rain shaft — evaporation cools the air it falls through</text>
  <text x="664" y="543" fill="#8fa8c0" font-size="10.5">cold pool spreading</text>

  <line x1="312" y1="486" x2="358" y2="508" stroke="#7d8b9c" stroke-width="1"/>
  <text x="310" y="478" text-anchor="end" fill="#c6cfdb" font-size="11">wall cloud, funnel</text>
  <text x="310" y="490" text-anchor="end" fill="#a8b3c2" font-size="10.5">and debris cloud</text>

  <!-- caption -->
  <text x="16" y="578" fill="#8f9cad" font-size="10.5">Drawn to scale: the domain is 20.2 km across and 14.4 km deep on a 90 m grid, and every height is the shipped sounding's.</text>
  <text x="16" y="594" fill="#8f9cad" font-size="10.5">The sides are periodic with a relaxation margin (shaded, right), so the anvil is cut off at the frame — a real one streams a hundred kilometres further.</text>
  <text x="16" y="610" fill="#8f9cad" font-size="10.5">The funnel is to scale too: 1 km tall and four grid cells across, which is the whole reason the tornado is drawn rather than simulated.</text>

</g>
</svg>
